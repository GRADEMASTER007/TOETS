            "@type": "SearchAction",
            "target": "https://marketplacehub.company/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://marketplacehub.company/#webapp",
